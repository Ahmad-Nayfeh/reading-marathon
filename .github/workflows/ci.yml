name: CI

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android · tests, screenshots, APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config
        env:
          MARATHON_GOOGLE_SERVICES_BASE64: ${{ secrets.MARATHON_GOOGLE_SERVICES_BASE64 }}
        run: bash ci/firebase-config.sh

      - name: Unit tests (scoring rules, CSV import, analytics)
        run: ./gradlew :core:test --stacktrace

      - name: Screenshot tour of the real app (Robolectric)
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Decode release keystore (only if the secrets exist)
        env:
          MARATHON_KEYSTORE_BASE64: ${{ secrets.MARATHON_KEYSTORE_BASE64 }}
          MARATHON_KEYSTORE_PASSWORD: ${{ secrets.MARATHON_KEYSTORE_PASSWORD }}
          MARATHON_KEY_ALIAS: ${{ secrets.MARATHON_KEY_ALIAS }}
          MARATHON_KEY_PASSWORD: ${{ secrets.MARATHON_KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/reading-marathon.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/reading-marathon-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reading-marathon-apk
          path: out/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/shots
          if-no-files-found: warn

  firestore-rules:
    name: Firestore · security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        working-directory: firestore-tests
        run: npm install --no-audit --no-fund
      - name: Rules tests
        working-directory: firestore-tests
        run: npm test
