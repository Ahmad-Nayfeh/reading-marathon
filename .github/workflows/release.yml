name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  android:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Firebase config
        env:
          MARATHON_GOOGLE_SERVICES_BASE64: ${{ secrets.MARATHON_GOOGLE_SERVICES_BASE64 }}
        run: bash ci/firebase-config.sh
      - name: Decode release keystore
        env:
          MARATHON_KEYSTORE_BASE64: ${{ secrets.MARATHON_KEYSTORE_BASE64 }}
          MARATHON_KEYSTORE_PASSWORD: ${{ secrets.MARATHON_KEYSTORE_PASSWORD }}
          MARATHON_KEY_ALIAS: ${{ secrets.MARATHON_KEY_ALIAS }}
          MARATHON_KEY_PASSWORD: ${{ secrets.MARATHON_KEY_PASSWORD }}
        run: bash ci/prepare-signing.sh
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Build release APK
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CODE=$(git rev-list --count HEAD)
          ./gradlew :app:assembleRelease -Pmarathon.versionName="$VERSION" -Pmarathon.versionCode="$CODE" --stacktrace
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/reading-marathon-${VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: out/*.apk

  publish:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ماراثون القراءة v${{ needs.android.outputs.version }}
          files: assets/**/*.apk
          body: |
            ## ماراثون القراءة v${{ needs.android.outputs.version }}

            نزّل `reading-marathon-${{ needs.android.outputs.version }}.apk` على هاتف أندرويد وافتحه لتثبيته (اسمح بالتثبيت من هذا المصدر إن طُلب).

            صفحة التطبيق: https://ahmad-nayfeh.github.io/marathon/
